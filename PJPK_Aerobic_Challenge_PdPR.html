<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PJPK Aerobic Challenge</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#061512;color:#ecfffb;padding:20px}
.wrap{max-width:760px;margin:auto}.hero,.card{background:#0d2926;border:1px solid #24534d;border-radius:20px;padding:22px}.hero{background:linear-gradient(135deg,#071b19,#0d2926 60%,#123b35);position:relative;overflow:hidden}.hero:after{content:"01";position:absolute;right:20px;top:2px;font-size:90px;font-weight:900;color:#fff1;font-style:italic}.eyebrow{font-size:12px;letter-spacing:2px;color:#79e2d2;font-weight:800}.title{font-size:30px;font-weight:900;margin:7px 0}.sub{color:#a9c7c2}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stat{background:#ffffff0d;border:1px solid #ffffff12;border-radius:12px;padding:9px 13px;min-width:90px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:#a9c7c2;text-transform:uppercase}.track{height:7px;background:#183b37;border-radius:99px;margin-top:18px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#14b8a6,#79e2d2,#d7f34b);width:0;transition:.3s}.meta{display:flex;justify-content:space-between;color:#a9c7c2;font-size:12px;margin-top:5px}.card{margin-top:15px}.qnum{font-size:11px;color:#79e2d2;font-weight:800;letter-spacing:1.5px}.question{font-size:20px;line-height:1.45;font-weight:800;margin:10px 0 18px}.option{display:flex;gap:12px;width:100%;text-align:left;background:#102f2b;border:1px solid #27534d;color:#ecfffb;padding:13px;border-radius:13px;margin:9px 0;cursor:pointer;font-size:14px;line-height:1.4}.option:hover{border-color:#52d7c7}.letter{flex:0 0 29px;height:29px;border-radius:8px;background:#19423d;display:grid;place-items:center;font-weight:900;color:#b9fff4}.correct{border-color:#d7f34b!important;background:#d7f34b14!important}.wrong{border-color:#ff8585!important;background:#ff646414!important}.disabled{cursor:default}.feedback{display:none;margin-top:13px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45}.show{display:block}.good{background:#d7f34b0f;border:1px solid #d7f34b55}.bad{background:#ff64640d;border:1px solid #ff858555}.next,.restart{margin-top:14px;width:100%;padding:13px;border:0;border-radius:13px;background:#b9fff4;color:#07332e;font-weight:900;cursor:pointer}.result{text-align:center;padding:25px 10px}.trophy{font-size:52px}.bigscore{font-size:50px;font-weight:900;color:#79e2d2}.rank{font-size:18px;font-weight:900}.result p{color:#a9c7c2}.note{margin-top:14px;color:#8eaca7;font-size:12px;text-align:center}@media(max-width:500px){body{padding:10px}.hero,.card{padding:16px}.title{font-size:24px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<div class="eyebrow">PdPR • PJPK • AEROBIC FITNESS</div>
<div class="title">🏁 PJPK AEROBIC CHALLENGE</div>
<div class="sub">Uji pengetahuan anda. Jawab semua 10 soalan dan kumpul mata!</div>
<div class="stats">
<div class="stat"><b id="score">0</b><span>Skor</span></div>
<div class="stat"><b id="streak">0 🔥</b><span>Streak</span></div>
<div class="stat"><b id="remain">10</b><span>Soalan</span></div>
</div>
<div class="track"><div id="fill" class="fill"></div></div>
<div class="meta"><span id="progress">Soalan 1 daripada 10</span><span>GO! 🚀</span></div>
</div>
<div id="game" class="card"></div>
<div class="note">PJPK • PdPR</div>
</div>
<script>
const qs=[
["Apakah yang dimaksudkan dengan kapasiti aerobik?",["Keupayaan otot mengangkat beban yang berat dalam masa yang singkat.","Keupayaan jantung, paru-paru dan sistem peredaran darah membekalkan oksigen kepada otot semasa melakukan aktiviti fizikal berterusan.","Keupayaan sendi bergerak dalam julat pergerakan yang maksimum.","Keupayaan badan merehatkan otot selepas aktiviti fizikal berterusan."],1,"Kapasiti aerobik berkaitan dengan keupayaan sistem kardiovaskular dan pernafasan membekalkan oksigen kepada otot ketika aktiviti berterusan."],
["Mengapa jari telunjuk dan jari tengah digunakan untuk mengukur kadar nadi, dan bukannya ibu jari?",["Ibu jari terlalu keras untuk menekan salur darah.","Jari telunjuk dan jari tengah mempunyai kawasan permukaan yang lebih luas.","Ibu jari mempunyai denyutan nadinya yang tersendiri yang boleh mengelirukan bacaan.","Jari telunjuk lebih sensitif terhadap suhu kulit."],2,"Ibu jari mempunyai denyutan nadinya sendiri. Ini boleh mengganggu atau mengelirukan bacaan kadar nadi."],
["Seorang murid berumur 15 tahun ingin menentukan Kadar Nadi Maksimum (KNM) beliau. Berapakah nilai KNM murid tersebut?",["220 bpm","205 bpm","195 bpm","180 bpm"],1,"KNM = 220 − umur. Jadi, 220 − 15 = 205 bpm."],
["Pengiraan Kadar Nadi Latihan (KNL) memerlukan pertukaran peratus intensiti latihan. Jika intensiti yang dipilih ialah 75%, apakah nilai perpuluhan yang perlu digunakan dalam formula Kaedah Karvonen?",["7.5","0.075","0.75","75.0"],2,"75% ditukarkan kepada perpuluhan dengan membahagikan 75 kepada 100, iaitu 0.75."],
["Seorang pelajar melakukan aktiviti fizikal dan mendapati beliau berada di Zon Intensiti Rendah (60% hingga 70% daripada KNM). Apakah ciri utama usaha latihan pada zon ini?",["Usaha maksimum dan tidak boleh bercakap langsung.","Usaha sangat sukar dan hanya boleh menyebut satu perkataan.","Usaha ringan dan masih boleh bercakap dengan selesa.","Tiada kesan perubahan pada kadar nadi."],2,"Zon intensiti rendah biasanya membolehkan seseorang bercakap dengan selesa ketika melakukan aktiviti."],
["Dalam latihan litar aerobik yang mengandungi pelbagai stesen, aktiviti manakah yang bertujuan khusus untuk proses pemulihan?",["berjalan pantas","Tabata workout","Fartlek training","berjalan perlahan"],3,"Berjalan perlahan menggunakan intensiti lebih rendah dan sesuai digunakan sebagai aktiviti pemulihan."],
["Apakah yang diwakili oleh huruf 'F' dalam prinsip senaman FITT?",["Fitness (Kecergasan)","Flexibility (Kelenturan)","Frequency (Kekerapan)","Function (Fungsi)"],2,"Dalam prinsip FITT, F merujuk kepada Frequency atau Kekerapan melakukan aktiviti fizikal."],
["Antara berikut, manakah penyataan yang betul mengenai Kadar Nadi Rehat (KNR)?",["Bilangan denyutan jantung seminit selepas tamat latihan intensiti tinggi.","Bilangan denyutan jantung seminit ketika badan berehat dan digunakan dalam formula KNL.","Nilai kadar nadi tetap iaitu 220 bpm untuk semua lapisan umur.","Kadar nadi paling tinggi yang boleh dicapai oleh seseorang."],1,"KNR ialah bilangan denyutan jantung seminit ketika badan berada dalam keadaan rehat dan merupakan salah satu nilai yang digunakan dalam pengiraan KNL."],
["Apakah langkah pertama yang betul sebelum seseorang mengukur Kadar Nadi Rehat (KNR) bagi mendapatkan bacaan yang tepat?",["Berlari setempat selama 5 minit.","Duduk dan berehat dengan tenang terlebih dahulu.","Mendidihkan air dan minum air suam.","Mengira kadar nadi semasa berjalan pantas."],1,"Badan perlu berada dalam keadaan tenang dan berehat terlebih dahulu supaya bacaan KNR lebih sesuai menggambarkan keadaan rehat."],
["Mengikut prinsip FITT, perkara yang merujuk kepada tempoh atau durasi sesuatu aktiviti fizikal dijalankan tergolong di bawah komponen:",["Frequency (Kekerapan)","Intensity (Intensiti)","Time (Masa)","Type (Jenis)"],2,"Dalam FITT, Time merujuk kepada tempoh atau durasi sesuatu aktiviti fizikal dilakukan."]
];
let i=0,score=0,streak=0,answered=false;
const game=document.getElementById("game");
function render(){
answered=false;
const x=qs[i];
document.getElementById("progress").textContent=`Soalan ${i+1} daripada 10`;
document.getElementById("remain").textContent=10-i;
document.getElementById("fill").style.width=(i/10*100)+"%";
game.innerHTML=`<div class="qnum">⚡ CHALLENGE ${String(i+1).padStart(2,"0")}</div><div class="question">${x[0]}</div><div id="opts">${x[1].map((v,n)=>`<button class="option" data-n="${n}"><span class="letter">${String.fromCharCode(65+n)}</span><span>${v}</span></button>`).join("")}</div><div id="fb" class="feedback"></div>`;
game.querySelectorAll(".option").forEach(b=>b.onclick=()=>choose(+b.dataset.n));
}
function choose(n){
if(answered)return;answered=true;
const x=qs[i],ok=n===x[2];
game.querySelectorAll(".option").forEach((b,k)=>{b.classList.add("disabled");if(k===x[2])b.classList.add("correct");if(k===n&&!ok)b.classList.add("wrong")});
if(ok){score+=10;streak++}else streak=0;
document.getElementById("score").textContent=score;
document.getElementById("streak").textContent=streak+" 🔥";
const fb=document.getElementById("fb");fb.className="feedback show "+(ok?"good":"bad");fb.innerHTML=ok?`🎉 <b>Betul!</b> +10 mata<br>${x[3]}`:`💡 <b>Belum tepat.</b><br>${x[3]}`;
const btn=document.createElement("button");btn.className="next";btn.textContent=i===9?"🏆 Lihat Keputusan":"➡️ Soalan Seterusnya";btn.onclick=()=>{i++;i<10?render():result()};game.appendChild(btn);
}
function result(){
document.getElementById("fill").style.width="100%";document.getElementById("progress").textContent="Cabaran selesai!";document.getElementById("remain").textContent=0;
let title=score===100?"PERFECT!":score>=80?"HEBAT!":score>=60?"BAGUS!":"TERUSKAN USAHA!";
game.innerHTML=`<div class="result"><div class="trophy">${score===100?"🏆":score>=80?"🥇":score>=60?"🥈":"💪"}</div><div class="bigscore">${score}/100</div><div class="rank">${title}</div><p>Anda telah melengkapkan semua 10 soalan PJPK.</p><p>${score===100?"Semua jawapan tepat! Memang padu!":score>=80?"Penguasaan sangat baik. Teruskan usaha!":score>=60?"Sudah bagus! Cuba ulang kaji bahagian yang tersilap.":"Jangan risau — cuba semula dan tingkatkan skor anda!"}</p><button class="restart">🔄 Cuba Semula</button></div>`;
game.querySelector(".restart").onclick=()=>{i=0;score=0;streak=0;document.getElementById("score").textContent=0;document.getElementById("streak").textContent="0 🔥";render()};
}
render();
</script>
</body>
</html>
